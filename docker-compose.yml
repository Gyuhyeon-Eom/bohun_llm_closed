# 보훈심사 AI 지원 시스템 — 전체 스택 (API + PostgreSQL/pgvector + MinIO)
#
#   기동:      docker compose up -d          (api는 로컬 빌드)
#   폐쇄망:    이미지 tar 반입(docs/DOCKER.md) → docker load → docker compose up -d
#   개발 LLM:  docker compose --profile llm up -d   (Ollama 추가 — 운영은 FabriX라 불필요)
#
# 기본값은 시연·개발 프로파일: LLM_BACKEND=mock, EMBED_BACKEND=hash.
# 운영 전환은 .env에서 FABRIX_*·EMBED_MODEL(bge-m3 반입 경로)만 교체.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bohun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bohun}
      POSTGRES_DB: ${POSTGRES_DB:-bohun}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bohun} -d ${POSTGRES_DB:-bohun}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-bohun}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-bohun-secret}
    ports:
      - "9000:9000"   # S3 API (presigned URL 접근 — 브라우저에서 열람)
      - "9001:9001"   # 관리 콘솔
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        WITH_ML: ${WITH_ML:-0}     # 0=경량(hash 임베딩, 시연) / 1=FlagEmbedding 포함(운영)
        OFFLINE: ${OFFLINE:-0}     # 1=폐쇄망 wheel 번들로 빌드
    environment:
      PG_DSN: postgresql://${POSTGRES_USER:-bohun}:${POSTGRES_PASSWORD:-bohun}@db:5432/${POSTGRES_DB:-bohun}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}  # 브라우저 접근 주소
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-bohun}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-bohun-secret}
      LLM_BACKEND: ${LLM_BACKEND:-mock}
      FABRIX_ENDPOINT: ${FABRIX_ENDPOINT:-}
      FABRIX_MODEL: ${FABRIX_MODEL:-}
      FABRIX_API_KEY: ${FABRIX_API_KEY:-}
      FABRIX_BASE_URL: ${FABRIX_BASE_URL:-}
      FABRIX_CLIENT_KEY: ${FABRIX_CLIENT_KEY:-}
      FABRIX_PASS_KEY: ${FABRIX_PASS_KEY:-}
      FABRIX_USER_EMAIL: ${FABRIX_USER_EMAIL:-}
      FABRIX_MODEL_ID_MAIN: ${FABRIX_MODEL_ID_MAIN:-}
      FABRIX_MODEL_ID_LIGHT: ${FABRIX_MODEL_ID_LIGHT:-}
      EMBED_BACKEND: ${EMBED_BACKEND:-hash}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      ORCH_BACKEND: ${ORCH_BACKEND:-langgraph}
      LLM_MODEL_MAIN: ${LLM_MODEL_MAIN:-gpt-oss-120b}
      LLM_MODEL_LIGHT: ${LLM_MODEL_LIGHT:-gemma-4-31b}
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:-}
      EMBEDDING_API: ${EMBEDDING_API:-}
      RERANK_API: ${RERANK_API:-}
      SECURITY_FILTER_API: ${SECURITY_FILTER_API:-}
      SEED_ON_START: ${SEED_ON_START:-1}
      DEMO_SEED: ${DEMO_SEED:-1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # 개발용 로컬 LLM (운영 폐쇄망은 FabriX — 이 서비스는 반입 불필요)
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  ollamadata:
